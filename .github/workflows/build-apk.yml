
name: Compilar GB Voz Inteligente

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto ZIP
        run: |
          ls -la
          unzip -q *.zip -d .
          ls -la GB-Voz-Inteligente || true

      - name: Aceitar licenças do Android
        run: yes | sdkmanager --licenses || true

      - name: Compilar aplicativo
        run: gradle -p GB-Voz-Inteligente :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GB-Voz-Inteligente-APK
          path: GB-Voz-Inteligente/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
